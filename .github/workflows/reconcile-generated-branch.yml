name: Reconcile Generated Branch

on:
  push:
    branches:
      - feat/61-complete-routine-guard

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/61-complete-routine-guard
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check pypdf==6.17.0

      - name: Rebuild generated artifacts deterministically
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/source-audit/city-updates-current.json").read_text(encoding="utf-8"))
          print(payload["asOf"])
          PY
          )"
          python scripts/extract_city_updates.py --as-of "$AS_OF"
          python scripts/build_master_data.py

      - name: Commit generated artifacts only
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            data/source-audit/city-updates-current.json
            data/thu-tuc.json
            data/master-data-audit.csv
            data/master-data-excluded.json
            data/BAO_CAO_MASTER_DATA_HIEN_HANH.md
            js/master-data-fallback.js
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Generated artifacts already deterministic."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "fix(data): reconcile deterministic generated artifacts"
          git push origin HEAD:feat/61-complete-routine-guard
