# Phát hành bảng niêm yết TTHC lên Google Firebase Hosting.
# Xác thực bằng OIDC + Workload Identity Federation; không dùng service-account key.
# Chỉ deploy khi repository variable FIREBASE_PROJECT_ID đã được khai báo.
name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "data/thu-tuc.json"
      - "firebase.json"
      - "scripts/build_site.py"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GOOGLE_WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER || vars.GOOGLE_WIF_PROVIDER || 'projects/445454141333/locations/global/workloadIdentityPools/github-actions/providers/github' }}
      GOOGLE_SERVICE_ACCOUNT: ${{ vars.FIREBASE_SERVICE_ACCOUNT || vars.GOOGLE_SERVICE_ACCOUNT || 'tthc-sheets-sync@gen-lang-client-0080020304.iam.gserviceaccount.com' }}
      FIREBASE_TOOLS_VERSION: "15.31.0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate Master Data and static site
        run: python scripts/check_static_site.py

      - name: Build site artifact
        run: python scripts/build_site.py --out _site

      - name: Check deploy configuration
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Pull Request: chỉ build/kiểm tra, không deploy."
          elif [ -z "${FIREBASE_PROJECT_ID}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa khai báo repository variable FIREBASE_PROJECT_ID - bỏ qua deploy Firebase."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy to Firebase Hosting
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --only hosting \
            --project "${FIREBASE_PROJECT_ID}" \
            --non-interactive \
            --message "main@${GITHUB_SHA::7}"

      - name: Verify public site
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_PROJECT_ID}.web.app"
          for path in "/" "/data/thu-tuc.json" "/js/app.js"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${base}${path}")
            echo "${base}${path} -> ${code}"
            [ "${code}" = "200" ] || { echo "::error::${path} trả về ${code}"; exit 1; }
          done
          echo "### Firebase Hosting: ${base}" >> "$GITHUB_STEP_SUMMARY"
