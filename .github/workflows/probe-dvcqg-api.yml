name: Probe DVCQG API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-dvcqg-api
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/issue-74-priority50-enrichment
      - name: Probe browser resources
        shell: pwsh
        run: ./scripts/probe_dvcqg_api.ps1
