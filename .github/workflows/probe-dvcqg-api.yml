name: Probe DVCQG API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-dvcqg-api
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-74-priority50-enrichment
      - name: Probe browser resources
        shell: pwsh
        run: ./scripts/probe_dvcqg_api.ps1
