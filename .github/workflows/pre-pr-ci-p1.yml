name: Pre-PR CI P1

on:
  push:
    branches:
      - feat/issue-74-priority50-enrichment

permissions:
  contents: read

concurrency:
  group: pre-pr-ci-p1
  cancel-in-progress: true

jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check pypdf==6.17.0

      - name: Python syntax
        run: |
          python -m py_compile scripts/canonical_v4.py scripts/migrate_canonical_v4.py scripts/build_priority50_guidance.py scripts/materialize_priority50_guidance.py scripts/validate_priority50_guidance.py scripts/update_official_sources.py scripts/extract_city_updates.py scripts/build_master_data.py scripts/build_master_delta.py scripts/fetch_dvc_mapping.py scripts/validate_tthc_guidance.py scripts/apply_guidance_enrichment.py scripts/build_tthc_tracking.py scripts/check_static_site.py scripts/routine_guard.py scripts/write_routine_run_record.py scripts/check_routine_health.py

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild committed snapshot deterministically
        shell: bash
        run: |
          set -euo pipefail
          AS_OF=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("data/source-audit/city-updates-current.json").read_text(encoding="utf-8"))["asOf"])')
          python scripts/extract_city_updates.py --as-of "$AS_OF"
          python scripts/build_master_data.py
          python scripts/validate_tthc_guidance.py
          python scripts/apply_guidance_enrichment.py
          python scripts/build_tthc_tracking.py
          git diff --exit-code -- data/source-audit/city-updates-current.json data/thu-tuc.json data/master-data-audit.csv data/master-data-excluded.json data/BAO_CAO_MASTER_DATA_HIEN_HANH.md data/THEO_DOI_THAY_DOI_TTHC.csv js/master-data-fallback.js

      - name: Validate guidance enrichment contract
        run: python scripts/validate_tthc_guidance.py

      - name: Validate priority-50 enrichment coverage
        run: python scripts/validate_priority50_guidance.py --require-complete

      - name: Validate canonical TTHC contract
        run: python scripts/validate_canonical_contract.py

      - name: Verify canonical v4 migration is idempotent
        run: python scripts/migrate_canonical_v4.py --check

      - name: Static data and HTML audit
        run: python scripts/check_static_site.py

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/data.js
          node --check js/master-data-fallback.js
          node --check js/extra-data.js
          node --check js/app.js
          node --check sw.js
