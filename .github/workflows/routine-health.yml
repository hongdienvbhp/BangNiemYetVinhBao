name: Routine Health Check

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Read Official TTHC Update history
        shell: bash
        run: |
          set -euo pipefail
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/official-data-update.yml/runs" -f per_page=100 > /tmp/official-data-update-runs.json

      - name: Evaluate routine health
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_routine_health.py             --history /tmp/official-data-update-runs.json             --fail-unhealthy
