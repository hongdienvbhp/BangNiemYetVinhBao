name: Routine Health Check

on:
  schedule:
    # 17:00 Asia/Ho_Chi_Minh — sau lượt Official TTHC Update (thường khởi chạy trễ tới ~12:45)
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"

      - name: Read Official TTHC Update history
        shell: bash
        run: |
          set -euo pipefail
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/official-data-update.yml/runs" \
            -f per_page=100 > /tmp/official-data-update-runs.json

      - name: Select current-period runs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_routine_health.py \
            --history /tmp/official-data-update-runs.json \
            --print-period-run-ids > /tmp/routine-run-ids.txt

      - name: Download terminal routine records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/routine-records
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            target="/tmp/routine-records/$run_id"
            mkdir -p "$target"
            if ! gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "routine-run-$run_id" \
              --dir "$target"; then
              echo "No terminal artifact available for run $run_id; health evaluator will fail closed if required."
            fi
          done < /tmp/routine-run-ids.txt

      - name: Evaluate routine health
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_routine_health.py \
            --history /tmp/official-data-update-runs.json \
            --records-dir /tmp/routine-records \
            --fail-unhealthy | tee /tmp/routine-health.json

      - name: Open or update alert Issue
        if: failure() && steps.evaluate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          title="Cảnh báo: Official TTHC Update không khỏe"
          result="$(cat /tmp/routine-health.json 2>/dev/null || echo '{}')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf 'Routine Health Check thất bại.\n\n- Kết quả: `%s`\n- Lượt kiểm tra: %s\n\nKiểm tra lượt Official TTHC Update gần nhất; dữ liệu TTHC có thể chưa được cập nhật.' "$result" "$run_url")"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close alert Issue when healthy
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          title="Cảnh báo: Official TTHC Update không khỏe"
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "Routine Health Check đã khỏe lại: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
