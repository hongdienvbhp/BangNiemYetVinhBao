name: Priority 50 Guidance Capture

on:
  push:
    branches:
      - feat/issue-74-priority50-enrichment

permissions:
  contents: write

concurrency:
  group: priority50-guidance-capture
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-74-priority50-enrichment
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Capture official DVCQG details read-only
        shell: pwsh
        run: |
          ./scripts/fetch_priority50_guidance_readonly.ps1

      - name: Build deterministic enrichment
        shell: pwsh
        run: |
          python scripts/build_priority50_guidance.py
          python scripts/validate_tthc_guidance.py
          python scripts/validate_priority50_guidance.py

      - name: Commit captured evidence and enrichment
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-audit/priority50-guidance-raw-current.json data/tthc-guidance-enrichment.json
          if (git diff --cached --quiet) {
            Write-Output "No changes to commit."
          } else {
            git commit -m "data(p1): capture priority-50 official guidance evidence"
            git push origin HEAD:feat/issue-74-priority50-enrichment
          }
