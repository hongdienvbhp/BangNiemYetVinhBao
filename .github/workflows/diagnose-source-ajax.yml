name: Diagnose official source AJAX contract

on:
  pull_request:
    paths:
      - scripts/diagnose_official_ajax_contract.py
      - .github/workflows/diagnose-source-ajax.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 161
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"

      - name: Run read-only source diagnostic
        run: python scripts/diagnose_official_ajax_contract.py
