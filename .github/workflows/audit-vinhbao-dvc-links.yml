name: Audit Vinh Bao DVC Links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Audit mapping candidates
        run: python scripts/audit_dvc_mapping_candidates.py
      - name: Audit submission links
        run: python scripts/audit_vinhbao_submission_links.py
