name: Materialize Priority 50 Guidance

on:
  push:
    branches:
      - feat/issue-74-priority50-enrichment

permissions:
  contents: write

concurrency:
  group: materialize-priority50-guidance
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-74-priority50-enrichment
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Materialize and validate enrichment
        run: |
          python scripts/materialize_priority50_guidance.py
          python scripts/validate_tthc_guidance.py
          python scripts/validate_priority50_guidance.py --require-complete

      - name: Rebuild canonical and validate
        run: |
          python scripts/build_master_data.py
          python scripts/apply_guidance_enrichment.py
          python scripts/build_tthc_tracking.py
          python scripts/reconcile_priority51_crosswalk.py
          python scripts/validate_canonical_contract.py
          python scripts/validate_priority50_guidance.py --require-complete
          git diff --check

      - name: Commit materialized canonical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/tthc-guidance-enrichment.json \
            data/thu-tuc.json \
            js/master-data-fallback.js \
            data/master-data-audit.csv \
            data/master-data-excluded.json \
            data/BAO_CAO_MASTER_DATA_HIEN_HANH.md \
            data/THEO_DOI_THAY_DOI_TTHC.csv \
            data/priority-51-crosswalk.json
          if git diff --cached --quiet; then
            echo "No materialized changes."
          else
            git commit -m "data(p1): materialize verified priority-50 guidance"
            git push origin HEAD:feat/issue-74-priority50-enrichment
          fi
