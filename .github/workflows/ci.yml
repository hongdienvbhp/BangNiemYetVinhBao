name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check pypdf==6.17.0

      - name: Python syntax
        run: |
          python -m py_compile             scripts/canonical_v4.py             scripts/migrate_canonical_v4.py             scripts/build_priority50_guidance.py             scripts/validate_priority50_guidance.py             scripts/audit_vinhbao_submission_links.py             scripts/validate_single_submit_link_ui.py             scripts/update_official_sources.py             scripts/extract_city_updates.py             scripts/build_master_data.py             scripts/build_master_delta.py             scripts/fetch_dvc_mapping.py             scripts/validate_tthc_guidance.py             scripts/apply_guidance_enrichment.py             scripts/build_tthc_tracking.py             scripts/check_static_site.py             scripts/routine_guard.py             scripts/write_routine_run_record.py             scripts/check_routine_health.py

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Detect canonical-build impact
        if: github.event_name == 'pull_request'
        id: canonical-impact
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD -- \
            data/ \
            js/master-data-fallback.js \
            scripts/update_official_sources.py \
            scripts/extract_city_updates.py \
            scripts/build_master_data.py \
            scripts/fetch_dvc_mapping.py | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild committed snapshot deterministically
        if: github.event_name != 'pull_request' || steps.canonical-impact.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/source-audit/city-updates-current.json").read_text(encoding="utf-8"))
          print(payload["asOf"])
          PY
          )"
          python scripts/extract_city_updates.py --as-of "$AS_OF"
          python scripts/build_master_data.py
          python scripts/validate_tthc_guidance.py
          python scripts/apply_guidance_enrichment.py
          python scripts/build_tthc_tracking.py
          git diff --exit-code --             data/source-audit/city-updates-current.json             data/thu-tuc.json             data/master-data-audit.csv             data/master-data-excluded.json             data/BAO_CAO_MASTER_DATA_HIEN_HANH.md             data/THEO_DOI_THAY_DOI_TTHC.csv             js/master-data-fallback.js

      - name: Validate guidance enrichment contract
        run: python scripts/validate_tthc_guidance.py

      - name: Validate priority-50 enrichment coverage
        run: python scripts/validate_priority50_guidance.py --require-complete

      - name: Validate canonical TTHC contract
        run: python scripts/validate_canonical_contract.py

      - name: Validate all Vinh Bao DVC submission links
        run: python scripts/audit_vinhbao_submission_links.py

      - name: Validate single DVC link in web detail
        run: python scripts/validate_single_submit_link_ui.py

      - name: Verify canonical v4 migration is idempotent
        run: python scripts/migrate_canonical_v4.py --check

      - name: Static data and HTML audit
        run: python scripts/check_static_site.py

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/data.js
          node --check js/master-data-fallback.js
          node --check js/extra-data.js
          node --check js/app.js
          node --check sw.js
