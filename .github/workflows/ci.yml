name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check pypdf==6.17.0

      - name: Python syntax
        run: |
          python -m py_compile             scripts/update_official_sources.py             scripts/extract_city_updates.py             scripts/build_master_data.py             scripts/build_master_delta.py             scripts/fetch_dvc_mapping.py             scripts/check_static_site.py

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild committed snapshot deterministically
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/source-audit/city-updates-current.json").read_text(encoding="utf-8"))
          print(payload["asOf"])
          PY
          )"
          python scripts/extract_city_updates.py --as-of "$AS_OF"
          python scripts/build_master_data.py
          git diff --exit-code --             data/source-audit/city-updates-current.json             data/thu-tuc.json             data/master-data-audit.csv             data/master-data-excluded.json             data/BAO_CAO_MASTER_DATA_HIEN_HANH.md             js/master-data-fallback.js

      - name: Static data and HTML audit
        run: python scripts/check_static_site.py

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/data.js
          node --check js/master-data-fallback.js
          node --check js/extra-data.js
          node --check js/app.js
          node --check sw.js
